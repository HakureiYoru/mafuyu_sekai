name: Apply first-batch patch
on:
  push:
    branches: [fix/first-batch-clarity-20260918]
    paths: [.github/workflows/apply-first-batch.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/first-batch-clarity-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/first-batch-clarity-20260918
          fetch-depth: 1
      - name: Apply verified source changes
        run: python3 .automation/apply-first-batch.py
      - name: Commit source changes to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs playwright.smoke.config.ts vercel.json
          git diff --cached --check
          git commit -m 'fix: cache saved HUD data, randomize new runs and sharpen high-DPI rendering'
          git push origin HEAD:refs/heads/fix/first-batch-clarity-20260918
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config playwright.smoke.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-batch-validation
          path: |
            playwright-report/smoke
            test-results/smoke
          if-no-files-found: ignore
          retention-days: 7
